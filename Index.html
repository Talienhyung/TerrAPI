<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TerrAPI – Suivi DHT11</title>
    <style>
      :root {
        /* Chrome sombre */
        --page: #0d0d0d;
        --surface: #1a1a19;
        --surface-raised: #222220;
        --border: rgba(255, 255, 255, 0.1);
        --ink: #ffffff;
        --ink-2: #c3c2b7;
        --muted: #898781;
        --grid: #2c2c2a;
        --baseline: #383835;
        /* Séries (validées CVD + contraste sur fond sombre) */
        --temp: #d95926;
        --hum: #3987e5;
        /* Statut */
        --good: #0ca30c;
        --critical: #d03b3b;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: var(--page);
        color: var(--ink);
        min-height: 100vh;
        padding: 32px 20px 48px;
      }

      .wrap {
        max-width: 960px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      /* ── En-tête ── */
      .page-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
      }

      .page-header h1 {
        font-size: 1.4rem;
        font-weight: 650;
        letter-spacing: -0.02em;
      }

      .page-header .subtitle {
        color: var(--muted);
        font-size: 0.85rem;
        margin-top: 4px;
      }

      .conn {
        text-align: right;
      }

      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 0.8rem;
        color: var(--ink-2);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 6px 12px;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--muted);
        transition: background 0.4s;
        flex: none;
      }
      .dot.connected {
        background: var(--good);
        box-shadow: 0 0 6px rgba(12, 163, 12, 0.5);
      }
      .dot.disconnected {
        background: var(--critical);
      }

      .last-update {
        font-size: 0.75rem;
        color: var(--muted);
        margin-top: 6px;
        min-height: 1em;
      }

      /* ── Tuiles temps réel ── */
      .tiles {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 16px;
      }

      .tile {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 18px 20px 14px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .tile-label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.8rem;
        font-weight: 500;
        color: var(--muted);
      }

      /* Clé de série : le trait coloré porte l'identité, jamais le texte */
      .key {
        width: 14px;
        height: 3px;
        border-radius: 2px;
        background: var(--c);
        flex: none;
      }

      .tile-value {
        font-size: 2.6rem;
        font-weight: 600;
        line-height: 1.1;
        color: var(--ink);
      }

      .tile-unit {
        font-size: 1.1rem;
        font-weight: 400;
        color: var(--ink-2);
        margin-left: 4px;
      }

      .tile-range {
        font-size: 0.75rem;
        color: var(--muted);
        min-height: 1em;
      }

      .spark {
        width: 100%;
        height: 44px;
        display: block;
        margin-top: 6px;
      }

      /* ── Historique ── */
      .history {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .filter-row {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
      }

      .filter-row .spacer {
        flex: 1;
      }

      .range-btn {
        background: transparent;
        border: 1px solid var(--baseline);
        color: var(--ink-2);
        font: inherit;
        font-size: 0.8rem;
        padding: 5px 12px;
        border-radius: 999px;
        cursor: pointer;
        transition: background 0.15s, color 0.15s, border-color 0.15s;
      }

      .range-btn:hover {
        background: var(--surface-raised);
        color: var(--ink);
      }

      .range-btn.active {
        background: var(--surface-raised);
        border-color: var(--ink-2);
        color: var(--ink);
        font-weight: 600;
      }

      .panels {
        display: flex;
        flex-direction: column;
        gap: 12px;
        transition: opacity 0.2s;
      }

      /* Rechargement : on garde le rendu précédent atténué, pas de squelette */
      .panels.is-loading {
        opacity: 0.45;
        pointer-events: none;
      }

      .panel {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 16px 18px 12px;
      }

      .panel-header {
        display: flex;
        align-items: baseline;
        gap: 8px;
        margin-bottom: 10px;
      }

      .panel-header h2 {
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--ink-2);
      }

      .panel-header .unit {
        font-size: 0.75rem;
        color: var(--muted);
      }

      /* Hauteur = tracé + bande de l'axe x, pour ne jamais rogner les libellés */
      .chart-wrap {
        position: relative;
        width: 100%;
        height: 190px;
      }
      .chart-wrap.with-x-axis {
        height: 220px;
      }

      .history-status {
        font-size: 0.78rem;
        color: var(--muted);
      }

      /* ── Vue tableau (équivalent accessible des graphiques) ── */
      details.table-view summary {
        font-size: 0.8rem;
        color: var(--muted);
        cursor: pointer;
        user-select: none;
      }
      details.table-view summary:hover {
        color: var(--ink);
      }

      .table-scroll {
        margin-top: 10px;
        max-height: 320px;
        overflow: auto;
        border: 1px solid var(--border);
        border-radius: 10px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.8rem;
      }

      th,
      td {
        text-align: right;
        padding: 6px 14px;
        border-bottom: 1px solid var(--grid);
        font-variant-numeric: tabular-nums;
        color: var(--ink-2);
        white-space: nowrap;
      }

      th:first-child,
      td:first-child {
        text-align: left;
      }

      thead th {
        position: sticky;
        top: 0;
        background: var(--surface-raised);
        color: var(--muted);
        font-weight: 500;
      }

      tbody tr:last-child td {
        border-bottom: none;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <!-- En-tête : titre + état de connexion -->
      <header class="page-header">
        <div>
          <h1>TerrAPI</h1>
          <p class="subtitle">Capteur DHT11 · ESP32 — temps réel</p>
        </div>
        <div class="conn">
          <div class="status-pill">
            <span class="dot" id="dot"></span>
            <span id="status-text">Connexion au serveur…</span>
          </div>
          <p class="last-update" id="last-update"></p>
        </div>
      </header>

      <!-- Tuiles temps réel -->
      <section class="tiles">
        <article class="tile">
          <p class="tile-label"><span class="key" style="--c: var(--temp)"></span>Température</p>
          <p class="tile-value"><span id="temp-value">--</span><span class="tile-unit">°C</span></p>
          <p class="tile-range" id="temp-range"></p>
          <canvas class="spark" id="temp-spark"></canvas>
        </article>
        <article class="tile">
          <p class="tile-label"><span class="key" style="--c: var(--hum)"></span>Humidité</p>
          <p class="tile-value"><span id="hum-value">--</span><span class="tile-unit">%</span></p>
          <p class="tile-range" id="hum-range"></p>
          <canvas class="spark" id="hum-spark"></canvas>
        </article>
      </section>

      <!-- Historique : une rangée de filtres au-dessus des deux panneaux qu'elle pilote -->
      <section class="history">
        <div class="filter-row" role="group" aria-label="Période affichée">
          <button class="range-btn" data-range="5m">5 min</button>
          <button class="range-btn" data-range="1h">1 h</button>
          <button class="range-btn" data-range="6h">6 h</button>
          <button class="range-btn active" data-range="24h">24 h</button>
          <button class="range-btn" data-range="7d">7 j</button>
          <button class="range-btn" data-range="30d">30 j</button>
          <button class="range-btn" data-range="all">Tout</button>
          <span class="spacer"></span>
          <button class="range-btn" id="reset-zoom-btn" hidden>Réinitialiser le zoom</button>
        </div>

        <div class="panels" id="panels">
          <div class="panel">
            <div class="panel-header">
              <h2>Température</h2>
              <span class="unit">°C</span>
            </div>
            <div class="chart-wrap"><canvas id="temp-chart"></canvas></div>
          </div>
          <div class="panel">
            <div class="panel-header">
              <h2>Humidité</h2>
              <span class="unit">%</span>
            </div>
            <div class="chart-wrap with-x-axis"><canvas id="hum-chart"></canvas></div>
          </div>
        </div>

        <p class="history-status" id="history-status">Chargement…</p>

        <details class="table-view">
          <summary>Voir les données en tableau</summary>
          <div class="table-scroll">
            <table>
              <thead>
                <tr>
                  <th scope="col">Horodatage</th>
                  <th scope="col">Température (°C)</th>
                  <th scope="col">Humidité (%)</th>
                </tr>
              </thead>
              <tbody id="table-body"></tbody>
            </table>
          </div>
        </details>
      </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
    <script>
      const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
      const COLORS = {
        temp: css("--temp"),
        hum: css("--hum"),
        surface: css("--surface"),
        ink: css("--ink"),
        ink2: css("--ink-2"),
        muted: css("--muted"),
        grid: css("--grid"),
        raised: css("--surface-raised"),
        border: "rgba(255,255,255,0.1)",
      };

      const fmt1 = (v) =>
        v.toLocaleString("fr-FR", { minimumFractionDigits: 1, maximumFractionDigits: 1 });

      // ══════════════ Tuiles temps réel + sparklines ══════════════
      const MAX_POINTS = 50;
      const live = { temp: [], hum: [] };

      const tempEl = document.getElementById("temp-value");
      const humEl = document.getElementById("hum-value");
      const tempRangeEl = document.getElementById("temp-range");
      const humRangeEl = document.getElementById("hum-range");
      const dot = document.getElementById("dot");
      const statusTx = document.getElementById("status-text");
      const lastUpd = document.getElementById("last-update");
      const tempSpark = document.getElementById("temp-spark");
      const humSpark = document.getElementById("hum-spark");

      // Une série par sparkline, échelle propre à chaque mesure
      function drawSpark(canvas, data, color) {
        const dpr = window.devicePixelRatio || 1;
        const w = canvas.clientWidth;
        const h = canvas.clientHeight;
        canvas.width = w * dpr;
        canvas.height = h * dpr;
        const ctx = canvas.getContext("2d");
        ctx.scale(dpr, dpr);
        ctx.clearRect(0, 0, w, h);
        if (data.length < 2) return;

        let min = Math.min(...data);
        let max = Math.max(...data);
        if (max - min < 1) {
          const mid = (min + max) / 2;
          min = mid - 0.5;
          max = mid + 0.5;
        }

        const padY = 6;
        const padX = 5;
        const x = (i) => padX + (i / (MAX_POINTS - 1)) * (w - 2 * padX);
        const y = (v) => h - padY - ((v - min) / (max - min)) * (h - 2 * padY);

        // Trait 2px + lavis à ~10 % d'opacité
        ctx.beginPath();
        data.forEach((v, i) => (i === 0 ? ctx.moveTo(x(i), y(v)) : ctx.lineTo(x(i), y(v))));
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.lineJoin = "round";
        ctx.lineCap = "round";
        ctx.stroke();

        ctx.lineTo(x(data.length - 1), h);
        ctx.lineTo(x(0), h);
        ctx.closePath();
        ctx.fillStyle = color + "1a";
        ctx.fill();

        // Point terminal avec anneau couleur surface
        const ex = x(data.length - 1);
        const ey = y(data[data.length - 1]);
        ctx.beginPath();
        ctx.arc(ex, ey, 4, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = COLORS.surface;
        ctx.stroke();
      }

      function drawSparks() {
        drawSpark(tempSpark, live.temp, COLORS.temp);
        drawSpark(humSpark, live.hum, COLORS.hum);
      }
      window.addEventListener("resize", drawSparks);

      function updateTiles(data) {
        const { temperature: temp, humidity: hum } = data;
        tempEl.textContent = fmt1(temp);
        humEl.textContent = fmt1(hum);

        live.temp.push(temp);
        live.hum.push(hum);
        if (live.temp.length > MAX_POINTS) {
          live.temp.shift();
          live.hum.shift();
        }
        drawSparks();

        tempRangeEl.textContent = `min ${fmt1(Math.min(...live.temp))} · max ${fmt1(Math.max(...live.temp))}`;
        humRangeEl.textContent = `min ${fmt1(Math.min(...live.hum))} · max ${fmt1(Math.max(...live.hum))}`;

        const when = new Date(data.receivedAt || Date.now());
        lastUpd.textContent = `Dernière mesure : ${when.toLocaleTimeString("fr-FR")}`;
      }

      // ══════════════ Historique (deux panneaux synchronisés) ══════════════
      const BUCKET_COUNT = 100; // 1 % de la plage affichée par tranche
      const NO_AGGREGATE_RANGES = new Set(["5m"]); // plages courtes : valeurs brutes
      const TABLE_MAX_ROWS = 500;

      // Durées des plages (miroir de HISTORY_RANGES_MS côté serveur) — fenêtre glissante en direct
      const RANGE_MS = {
        "5m": 5 * 60 * 1000,
        "1h": 60 * 60 * 1000,
        "6h": 6 * 60 * 60 * 1000,
        "24h": 24 * 60 * 60 * 1000,
        "7d": 7 * 24 * 60 * 60 * 1000,
        "30d": 30 * 24 * 60 * 60 * 1000,
      };

      const panels = document.getElementById("panels");
      const historyStatus = document.getElementById("history-status");
      const tableBody = document.getElementById("table-body");
      const resetZoomBtn = document.getElementById("reset-zoom-btn");
      const rangeButtons = document.querySelectorAll(".range-btn[data-range]");

      let rawPoints = []; // { x: Date, temp, hum }
      let fullRange = { min: 0, max: 0 };
      let aggregateEnabled = true;
      let currentRange = "24h";
      let isZoomed = false; // en zoom/pan, le direct n'écrase pas la vue

      // Regroupe les points en BUCKET_COUNT tranches sur [xMin, xMax], moyenne par tranche
      function computeBuckets(points, xMin, xMax) {
        const span = xMax - xMin;
        if (!points.length || span <= 0) return { tempData: [], humData: [], rows: [] };
        const bucketMs = span / BUCKET_COUNT;
        const buckets = Array.from({ length: BUCKET_COUNT }, () => ({
          tempSum: 0,
          humSum: 0,
          n: 0,
        }));

        points.forEach((p) => {
          const t = p.x.getTime();
          if (t < xMin || t > xMax) return;
          const idx = Math.min(BUCKET_COUNT - 1, Math.max(0, Math.floor((t - xMin) / bucketMs)));
          const b = buckets[idx];
          b.tempSum += p.temp;
          b.humSum += p.hum;
          b.n++;
        });

        const tempData = [];
        const humData = [];
        const rows = [];
        buckets.forEach((b, i) => {
          if (!b.n) return;
          const x = new Date(xMin + (i + 0.5) * bucketMs);
          const temp = b.tempSum / b.n;
          const hum = b.humSum / b.n;
          tempData.push({ x, y: temp });
          humData.push({ x, y: hum });
          rows.push({ x, temp, hum });
        });
        return { tempData, humData, rows };
      }

      function currentSeries(xMin, xMax) {
        if (aggregateEnabled) return computeBuckets(rawPoints, xMin, xMax);
        return {
          tempData: rawPoints.map((p) => ({ x: p.x, y: p.temp })),
          humData: rawPoints.map((p) => ({ x: p.x, y: p.hum })),
          rows: rawPoints,
        };
      }

      // Vue tableau : le pendant accessible des graphiques (textContent uniquement).
      // Reconstruite seulement quand elle est ouverte — inutile de régénérer 500 lignes
      // toutes les 2 s pour un tableau replié.
      const tableView = document.querySelector("details.table-view");
      let tableRows = [];
      tableView.addEventListener("toggle", () => {
        if (tableView.open) renderTable(tableRows);
      });

      function renderTable(rows) {
        tableRows = rows;
        if (!tableView.open) return;
        tableBody.replaceChildren();
        const slice = rows.slice(-TABLE_MAX_ROWS);
        slice.forEach((r) => {
          const tr = document.createElement("tr");
          const cells = [
            r.x.toLocaleString("fr-FR"),
            fmt1(r.temp),
            fmt1(r.hum),
          ];
          cells.forEach((text) => {
            const td = document.createElement("td");
            td.textContent = text;
            tr.appendChild(td);
          });
          tableBody.appendChild(tr);
        });
      }

      // Trait vertical qui suit l'infobulle : le lecteur vise une date, pas une ligne de 2px
      const crosshair = {
        id: "crosshair",
        afterDraw(chart) {
          const actives = chart.tooltip?.getActiveElements();
          if (!actives || !actives.length) return;
          const x = actives[0].element.x;
          const { top, bottom } = chart.chartArea;
          const ctx = chart.ctx;
          ctx.save();
          ctx.strokeStyle = COLORS.muted;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(x, top);
          ctx.lineTo(x, bottom);
          ctx.stroke();
          ctx.restore();
        },
      };

      function makeChart(canvasId, color, unit, showXTicks) {
        return new Chart(document.getElementById(canvasId).getContext("2d"), {
          type: "line",
          plugins: [crosshair],
          data: {
            datasets: [
              {
                data: [],
                borderColor: color,
                backgroundColor: color + "1a",
                fill: true,
                pointRadius: 0,
                pointHoverRadius: 5,
                pointHoverBackgroundColor: color,
                pointHoverBorderColor: COLORS.surface,
                pointHoverBorderWidth: 2,
                borderWidth: 2,
                tension: 0.25,
              },
            ],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: false,
            interaction: { mode: "index", intersect: false },
            scales: {
              x: {
                type: "time",
                time: {
                  tooltipFormat: "dd/MM/yyyy HH:mm:ss",
                  displayFormats: {
                    second: "HH:mm:ss",
                    minute: "HH:mm",
                    hour: "HH:mm",
                    day: "dd/MM",
                    week: "dd/MM",
                    month: "MM/yyyy",
                  },
                },
                ticks: { display: showXTicks, color: COLORS.muted, maxRotation: 0, autoSkipPadding: 16 },
                grid: { display: false },
                border: { color: COLORS.grid },
              },
              y: {
                grace: "15%",
                ticks: { color: COLORS.muted },
                grid: { color: COLORS.grid, lineWidth: 1 },
                border: { display: false },
                // Largeur d'axe fixe pour que les deux tracés restent alignés verticalement
                afterFit: (scale) => {
                  scale.width = 48;
                },
              },
            },
            plugins: {
              legend: { display: false }, // une seule série : le titre du panneau la nomme
              tooltip: {
                backgroundColor: COLORS.raised,
                borderColor: COLORS.border,
                borderWidth: 1,
                titleColor: COLORS.ink2,
                titleFont: { weight: "normal" },
                bodyColor: COLORS.ink,
                bodyFont: { weight: "600", size: 14 },
                padding: 10,
                cornerRadius: 8,
                displayColors: false,
                callbacks: {
                  label: (ctx) => `${fmt1(ctx.parsed.y)} ${unit}`,
                },
              },
              zoom: {
                pan: {
                  enabled: true,
                  mode: "x",
                  onPanComplete: ({ chart }) => syncWindow(chart),
                },
                zoom: {
                  wheel: { enabled: true },
                  pinch: { enabled: true },
                  mode: "x",
                  onZoomComplete: ({ chart }) => syncWindow(chart),
                },
              },
            },
          },
        });
      }

      const tempChart = makeChart("temp-chart", COLORS.temp, "°C", false);
      const humChart = makeChart("hum-chart", COLORS.hum, "%", true);
      const charts = [tempChart, humChart];

      function applySeries({ tempData, humData, rows }) {
        tempChart.data.datasets[0].data = tempData;
        humChart.data.datasets[0].data = humData;
        tempChart.update("none");
        humChart.update("none");
        renderTable(rows);
      }

      // resetZoom() et zoomScale() déclenchent aussi onZoom/PanComplete : ce garde
      // évite que syncWindow prenne une opération programmatique pour un zoom
      // utilisateur (ce qui épinglait l'axe x sur l'ancienne plage)
      let programmaticView = false;

      // Zoom/pan sur un panneau → même fenêtre sur l'autre + ré-agrégation
      function syncWindow(source) {
        if (programmaticView) return;
        const { min, max } = source.scales.x;
        programmaticView = true;
        charts.forEach((c) => {
          if (c !== source) c.zoomScale("x", { min, max }, "none");
        });
        programmaticView = false;
        isZoomed = true;
        resetZoomBtn.hidden = false;
        if (aggregateEnabled) applySeries(computeBuckets(rawPoints, min, max));
      }

      // Rend la main aux échelles automatiques (sans passer pour un zoom utilisateur)
      function resetView() {
        programmaticView = true;
        charts.forEach((c) => c.resetZoom("none"));
        programmaticView = false;
      }

      resetZoomBtn.addEventListener("click", () => {
        resetView();
        isZoomed = false;
        resetZoomBtn.hidden = true;
        applySeries(currentSeries(fullRange.min, fullRange.max));
      });

      function updateStatus(count) {
        historyStatus.textContent = count
          ? `${count} mesure(s) — ${
              aggregateEnabled
                ? "moyennées par tranche de 1 % de la période affichée"
                : "valeurs brutes"
            }, mises à jour en direct. Molette pour zoomer, glisser pour déplacer.`
          : "Aucune donnée sur cette période.";
      }

      async function loadHistory(range) {
        currentRange = range;
        panels.classList.add("is-loading");
        try {
          const res = await fetch(`/api/history?range=${encodeURIComponent(range)}`);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const rows = await res.json();

          rawPoints = rows.map((r) => ({
            x: new Date(r.receivedAt),
            temp: r.temperature,
            hum: r.humidity,
          }));
          fullRange = rawPoints.length
            ? { min: rawPoints[0].x.getTime(), max: rawPoints[rawPoints.length - 1].x.getTime() }
            : { min: 0, max: 0 };
          aggregateEnabled = !NO_AGGREGATE_RANGES.has(range);

          resetView();
          isZoomed = false;
          resetZoomBtn.hidden = true;
          applySeries(currentSeries(fullRange.min, fullRange.max));
          updateStatus(rawPoints.length);
        } catch (err) {
          console.error(err);
          historyStatus.textContent = "Erreur lors du chargement de l'historique.";
        } finally {
          panels.classList.remove("is-loading");
        }
      }

      rangeButtons.forEach((btn) => {
        btn.addEventListener("click", () => {
          rangeButtons.forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          loadHistory(btn.dataset.range);
        });
      });

      loadHistory("24h");

      // Chaque mesure SSE alimente aussi l'historique : fenêtre glissante sur la
      // plage choisie, sans toucher à la vue si l'utilisateur est en zoom/pan
      function appendToHistory(data) {
        if (!data.receivedAt) return;
        const p = { x: new Date(data.receivedAt), temp: data.temperature, hum: data.humidity };
        const t = p.x.getTime();
        // Doublon possible : le serveur renvoie la dernière mesure à la connexion
        if (rawPoints.length && t <= rawPoints[rawPoints.length - 1].x.getTime()) return;
        rawPoints.push(p);

        const spanMs = RANGE_MS[currentRange];
        if (spanMs) {
          const cutoff = t - spanMs;
          while (rawPoints.length && rawPoints[0].x.getTime() < cutoff) rawPoints.shift();
        }
        fullRange = { min: rawPoints[0].x.getTime(), max: t };

        if (isZoomed) return;
        applySeries(currentSeries(fullRange.min, fullRange.max));
        updateStatus(rawPoints.length);
      }

      // ══════════════ Connexion SSE ══════════════
      let wasConnected = false;

      function connect() {
        const evtSource = new EventSource("/api/stream");

        evtSource.onopen = () => {
          dot.className = "dot connected";
          statusTx.textContent = "Connecté — en attente de données…";
          // Après une coupure, recharge l'historique pour combler le trou
          if (wasConnected) loadHistory(currentRange);
          wasConnected = true;
        };

        evtSource.onmessage = (e) => {
          const data = JSON.parse(e.data);
          statusTx.textContent = "En direct";
          updateTiles(data);
          appendToHistory(data);
        };

        evtSource.onerror = () => {
          dot.className = "dot disconnected";
          statusTx.textContent = "Déconnecté — reconnexion dans 3 s…";
          evtSource.close();
          setTimeout(connect, 3000);
        };
      }

      connect();
    </script>
  </body>
</html>
