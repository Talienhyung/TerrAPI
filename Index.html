<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DHT11 – Données temps réel</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: system-ui, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 40px 20px;
      }

      h1 {
        font-size: 1.6rem;
        font-weight: 600;
        margin-bottom: 6px;
        letter-spacing: -0.02em;
      }

      .subtitle {
        color: #64748b;
        font-size: 0.9rem;
        margin-bottom: 40px;
      }

      .cards {
        display: flex;
        gap: 24px;
        flex-wrap: wrap;
        justify-content: center;
        margin-bottom: 40px;
      }

      .card {
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 16px;
        padding: 32px 40px;
        text-align: center;
        min-width: 200px;
        transition: transform 0.2s;
      }

      .card:hover {
        transform: translateY(-2px);
      }

      .card-icon {
        font-size: 2.5rem;
        margin-bottom: 12px;
        display: block;
      }

      .card-label {
        font-size: 0.8rem;
        color: #64748b;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        margin-bottom: 8px;
      }

      .card-value {
        font-size: 3rem;
        font-weight: 700;
        line-height: 1;
        transition: color 0.4s;
      }

      .card-unit {
        font-size: 1.2rem;
        font-weight: 400;
        opacity: 0.6;
      }

      #temp-value {
        color: #f97316;
      }
      #hum-value {
        color: #38bdf8;
      }

      /* Barre de progression */
      .progress-bar {
        width: 100%;
        height: 6px;
        background: #334155;
        border-radius: 3px;
        margin-top: 16px;
        overflow: hidden;
      }

      .progress-fill {
        height: 100%;
        border-radius: 3px;
        transition: width 0.6s ease;
      }

      #temp-bar {
        background: #f97316;
      }
      #hum-bar {
        background: #38bdf8;
      }

      /* Historique graphique simple */
      .history-section {
        width: 100%;
        max-width: 700px;
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 16px;
        padding: 24px;
        margin-bottom: 24px;
      }

      .history-section h2 {
        font-size: 0.85rem;
        color: #64748b;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-bottom: 16px;
      }

      canvas {
        width: 100%;
        height: 140px;
        display: block;
      }

      /* Historique complet (base de données) */
      .db-history-section {
        width: 100%;
        max-width: 900px;
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 16px;
        padding: 24px;
        margin-bottom: 24px;
      }

      .db-history-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 12px;
        margin-bottom: 16px;
      }

      .db-history-header h2 {
        font-size: 0.85rem;
        color: #64748b;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .range-buttons {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }

      .range-btn {
        background: #0f172a;
        border: 1px solid #334155;
        color: #94a3b8;
        font-size: 0.8rem;
        padding: 6px 12px;
        border-radius: 8px;
        cursor: pointer;
        transition: background 0.2s, color 0.2s;
      }

      .range-btn:hover {
        background: #334155;
        color: #e2e8f0;
      }

      .range-btn.active {
        background: #38bdf8;
        border-color: #38bdf8;
        color: #0f172a;
        font-weight: 600;
      }

      .db-chart-wrap {
        position: relative;
        width: 100%;
        height: 320px;
      }

      .db-history-status {
        font-size: 0.8rem;
        color: #475569;
        margin-top: 12px;
      }

      /* Statut connexion */
      .status-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.85rem;
        color: #64748b;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #64748b;
        transition: background 0.4s;
      }

      .dot.connected {
        background: #22c55e;
        box-shadow: 0 0 6px #22c55e88;
      }
      .dot.disconnected {
        background: #ef4444;
      }

      .last-update {
        font-size: 0.8rem;
        color: #475569;
        margin-top: 8px;
      }

      /* Animation flash lors d'une mise à jour */
      @keyframes flash {
        0% {
          background: #1e3a5f;
        }
        100% {
          background: #1e293b;
        }
      }
      .card.updated {
        animation: flash 0.5s ease;
      }
    </style>
  </head>
  <body>
    <h1>🌡 DHT11 — Dashboard</h1>
    <p class="subtitle">Données ESP32 en temps réel</p>

    <div class="cards">
      <!-- Température -->
      <div class="card" id="card-temp">
        <span class="card-icon">🌡</span>
        <div class="card-label">Température</div>
        <div class="card-value">
          <span id="temp-value">--</span>
          <span class="card-unit">°C</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="temp-bar" style="width: 0%"></div>
        </div>
      </div>

      <!-- Humidité -->
      <div class="card" id="card-hum">
        <span class="card-icon">💧</span>
        <div class="card-label">Humidité</div>
        <div class="card-value">
          <span id="hum-value">--</span>
          <span class="card-unit">%</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="hum-bar" style="width: 0%"></div>
        </div>
      </div>
    </div>

    <!-- Graphique historique -->
    <div class="history-section">
      <h2>Historique (50 dernières mesures)</h2>
      <canvas id="chart"></canvas>
    </div>

    <!-- Historique complet (base de données) -->
    <div class="db-history-section">
      <div class="db-history-header">
        <h2>Historique enregistré (base de données)</h2>
        <div class="range-buttons">
          <button class="range-btn" data-range="5m">5min</button>
          <button class="range-btn" data-range="1h">1h</button>
          <button class="range-btn" data-range="6h">6h</button>
          <button class="range-btn active" data-range="24h">24h</button>
          <button class="range-btn" data-range="7d">7j</button>
          <button class="range-btn" data-range="30d">30j</button>
          <button class="range-btn" data-range="all">Tout</button>
          <button class="range-btn" id="reset-zoom-btn">Réinitialiser le zoom</button>
        </div>
      </div>
      <div class="db-chart-wrap">
        <canvas id="db-chart"></canvas>
      </div>
      <div class="db-history-status" id="db-history-status">Chargement…</div>
    </div>

    <!-- Statut -->
    <div class="status-bar">
      <div class="dot" id="dot"></div>
      <span id="status-text">Connexion au serveur…</span>
    </div>
    <div class="last-update" id="last-update"></div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
    <script>
      const MAX_POINTS = 50;
      const history = { temp: [], hum: [], labels: [] };

      const tempEl = document.getElementById("temp-value");
      const humEl = document.getElementById("hum-value");
      const tempBar = document.getElementById("temp-bar");
      const humBar = document.getElementById("hum-bar");
      const dot = document.getElementById("dot");
      const statusTx = document.getElementById("status-text");
      const lastUpd = document.getElementById("last-update");
      const cardTemp = document.getElementById("card-temp");
      const cardHum = document.getElementById("card-hum");

      // ── Mini graphique canvas ──
      const canvas = document.getElementById("chart");
      const ctx = canvas.getContext("2d");

      function resizeCanvas() {
        canvas.width = canvas.offsetWidth;
        canvas.height = 140;
      }
      resizeCanvas();
      window.addEventListener("resize", () => {
        resizeCanvas();
        drawChart();
      });

      function drawChart() {
        const W = canvas.width,
          H = canvas.height;
        ctx.clearRect(0, 0, W, H);

        function drawLine(data, color, minVal, maxVal) {
          if (data.length < 2) return;
          ctx.beginPath();
          ctx.strokeStyle = color;
          ctx.lineWidth = 2;
          ctx.lineJoin = "round";
          data.forEach((v, i) => {
            const x = (i / (MAX_POINTS - 1)) * W;
            const y = H - ((v - minVal) / (maxVal - minVal)) * (H - 20) - 10;
            i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
          });
          ctx.stroke();

          // Remplissage dégradé léger
          ctx.lineTo(W, H);
          ctx.lineTo(0, H);
          ctx.closePath();
          const grad = ctx.createLinearGradient(0, 0, 0, H);
          grad.addColorStop(0, color + "40");
          grad.addColorStop(1, color + "00");
          ctx.fillStyle = grad;
          ctx.fill();
        }

        // Grille horizontale
        ctx.strokeStyle = "#334155";
        ctx.lineWidth = 0.5;
        [0.25, 0.5, 0.75].forEach((r) => {
          ctx.beginPath();
          ctx.moveTo(0, H * r);
          ctx.lineTo(W, H * r);
          ctx.stroke();
        });

        drawLine(history.temp, "#f97316", 0, 60);
        drawLine(history.hum, "#38bdf8", 0, 100);
      }

      // ── Mise à jour de l'UI ──
      function updateUI(data) {
        const temp = data.temperature;
        const hum = data.humidity;

        tempEl.textContent = temp.toFixed(1);
        humEl.textContent = hum.toFixed(1);

        tempBar.style.width = Math.min((temp / 60) * 100, 100) + "%";
        humBar.style.width = Math.min(hum, 100) + "%";

        // Historique
        const now = new Date(data.receivedAt || Date.now());
        const label = now.toLocaleTimeString("fr-FR");
        history.temp.push(temp);
        history.hum.push(hum);
        history.labels.push(label);
        if (history.temp.length > MAX_POINTS) {
          history.temp.shift();
          history.hum.shift();
          history.labels.shift();
        }
        drawChart();

        // Flash animation
        [cardTemp, cardHum].forEach((c) => {
          c.classList.remove("updated");
          void c.offsetWidth; // reflow pour relancer l'animation
          c.classList.add("updated");
        });

        lastUpd.textContent = `Dernière mise à jour : ${label}`;
      }

      // ── Historique complet depuis la DB (graph interactif Chart.js) ──
      const dbChartCanvas = document.getElementById("db-chart");
      const dbHistoryStatus = document.getElementById("db-history-status");
      const rangeButtons = document.querySelectorAll(".range-btn[data-range]");
      const BUCKET_COUNT = 100; // 1% de la plage affichée par tranche
      const NO_AGGREGATE_RANGES = new Set(["5m"]); // plages assez courtes pour afficher les valeurs brutes
      let dbChart = null;
      let dbRawPoints = []; // { x: Date, temp, hum } — toutes les mesures chargées
      let dbFullRange = { min: 0, max: 0 };
      let dbAggregateEnabled = true;

      // Regroupe les points en BUCKET_COUNT tranches sur [xMin, xMax] et moyenne temp/hum par tranche
      function computeBuckets(points, xMin, xMax) {
        const span = xMax - xMin;
        if (!points.length || span <= 0) return { tempData: [], humData: [] };
        const bucketMs = span / BUCKET_COUNT;
        const buckets = Array.from({ length: BUCKET_COUNT }, () => ({ tempSum: 0, tempN: 0, humSum: 0, humN: 0 }));

        points.forEach((p) => {
          const t = p.x.getTime();
          if (t < xMin || t > xMax) return;
          let idx = Math.floor((t - xMin) / bucketMs);
          if (idx >= BUCKET_COUNT) idx = BUCKET_COUNT - 1;
          if (idx < 0) idx = 0;
          const b = buckets[idx];
          b.tempSum += p.temp;
          b.tempN++;
          b.humSum += p.hum;
          b.humN++;
        });

        const tempData = [];
        const humData = [];
        buckets.forEach((b, i) => {
          const x = new Date(xMin + (i + 0.5) * bucketMs);
          if (b.tempN) tempData.push({ x, y: b.tempSum / b.tempN });
          if (b.humN) humData.push({ x, y: b.humSum / b.humN });
        });
        return { tempData, humData };
      }

      function rawSeries(points) {
        return {
          tempData: points.map((p) => ({ x: p.x, y: p.temp })),
          humData: points.map((p) => ({ x: p.x, y: p.hum })),
        };
      }

      // Recalcule les moyennes par tranche pour la plage x actuellement visible (zoom/pan)
      // Ne fait rien si l'agrégation est désactivée pour la plage en cours (ex : 5min, données déjà brutes)
      function refreshAggregation(chart) {
        if (!dbAggregateEnabled) return;
        const xScale = chart.scales.x;
        const { tempData, humData } = computeBuckets(dbRawPoints, xScale.min, xScale.max);
        chart.data.datasets[0].data = tempData;
        chart.data.datasets[1].data = humData;
        chart.update("none");
      }

      function renderDbChart(rows, range) {
        dbRawPoints = rows.map((r) => ({ x: new Date(r.receivedAt), temp: r.temperature, hum: r.humidity }));
        dbFullRange = dbRawPoints.length
          ? { min: dbRawPoints[0].x.getTime(), max: dbRawPoints[dbRawPoints.length - 1].x.getTime() }
          : { min: 0, max: 0 };
        dbAggregateEnabled = !NO_AGGREGATE_RANGES.has(range);

        const { tempData, humData } = dbAggregateEnabled
          ? computeBuckets(dbRawPoints, dbFullRange.min, dbFullRange.max)
          : rawSeries(dbRawPoints);

        if (dbChart) {
          dbChart.destroy();
        }

        dbChart = new Chart(dbChartCanvas.getContext("2d"), {
          type: "line",
          data: {
            datasets: [
              {
                label: dbAggregateEnabled ? "Température moyenne (°C)" : "Température (°C)",
                data: tempData,
                borderColor: "#f97316",
                backgroundColor: "#f9731633",
                yAxisID: "yTemp",
                pointRadius: 0,
                borderWidth: 2,
                tension: 0.25,
              },
              {
                label: dbAggregateEnabled ? "Humidité moyenne (%)" : "Humidité (%)",
                data: humData,
                borderColor: "#38bdf8",
                backgroundColor: "#38bdf833",
                yAxisID: "yHum",
                pointRadius: 0,
                borderWidth: 2,
                tension: 0.25,
              },
            ],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: false,
            interaction: { mode: "index", intersect: false },
            scales: {
              x: {
                type: "time",
                time: { tooltipFormat: "dd/MM/yyyy HH:mm:ss" },
                ticks: { color: "#64748b" },
                grid: { color: "#334155" },
              },
              yTemp: {
                position: "left",
                grace: "20%",
                ticks: { color: "#f97316" },
                grid: { color: "#334155" },
                title: { display: true, text: "°C", color: "#f97316" },
              },
              yHum: {
                position: "right",
                grace: "20%",
                ticks: { color: "#38bdf8" },
                grid: { display: false },
                title: { display: true, text: "%", color: "#38bdf8" },
              },
            },
            plugins: {
              legend: { labels: { color: "#e2e8f0" } },
              zoom: {
                pan: {
                  enabled: true,
                  mode: "x",
                  onPanComplete: ({ chart }) => refreshAggregation(chart),
                },
                zoom: {
                  wheel: { enabled: true },
                  pinch: { enabled: true },
                  mode: "x",
                  onZoomComplete: ({ chart }) => refreshAggregation(chart),
                },
              },
            },
          },
        });
      }

      async function loadHistory(range) {
        dbHistoryStatus.textContent = "Chargement…";
        try {
          const res = await fetch(`/api/history?range=${encodeURIComponent(range)}`);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const rows = await res.json();
          renderDbChart(rows, range);
          dbHistoryStatus.textContent = rows.length
            ? `${rows.length} mesure(s) — ${
                dbAggregateEnabled
                  ? "moyenne par tranche de 1% de la période affichée"
                  : "valeurs brutes (pas d'agrégation)"
              }. Molette pour zoomer, glisser pour déplacer`
            : "Aucune donnée sur cette période";
        } catch (err) {
          console.error(err);
          dbHistoryStatus.textContent = "Erreur lors du chargement de l'historique";
        }
      }

      rangeButtons.forEach((btn) => {
        btn.addEventListener("click", () => {
          rangeButtons.forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          loadHistory(btn.dataset.range);
        });
      });

      document.getElementById("reset-zoom-btn").addEventListener("click", () => {
        if (!dbChart) return;
        dbChart.resetZoom();
        if (!dbAggregateEnabled) return;
        const { tempData, humData } = computeBuckets(dbRawPoints, dbFullRange.min, dbFullRange.max);
        dbChart.data.datasets[0].data = tempData;
        dbChart.data.datasets[1].data = humData;
        dbChart.update("none");
      });

      loadHistory("24h");

      // ── Connexion SSE ──
      function connect() {
        const evtSource = new EventSource("/api/stream");

        evtSource.onopen = () => {
          dot.className = "dot connected";
          statusTx.textContent = "Connecté — en attente de données…";
        };

        evtSource.onmessage = (e) => {
          const data = JSON.parse(e.data);
          statusTx.textContent = "En direct ✓";
          updateUI(data);
        };

        evtSource.onerror = () => {
          dot.className = "dot disconnected";
          statusTx.textContent = "Déconnecté — reconnexion dans 3s…";
          evtSource.close();
          setTimeout(connect, 3000);
        };
      }

      connect();
    </script>
  </body>
</html>
